<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5a3 3 0 0 1 6 0v5"/>
        </svg>
        <h2>TTD Form Config</h2>
    </div>

    <div class="scroll-container">
        <div class="section">
            <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <h3>General Details</h3>
            </div>
            <input type="email" id="email" placeholder="Email Address">
            <div class="input-row">
                <input type="text" id="city" placeholder="City">
                <input type="text" id="state" placeholder="State">
            </div>
            <div class="input-row">
                <input type="text" id="country" placeholder="Country" value="India">
                <input type="text" id="pincode" placeholder="Pincode">
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <h3>Pilgrim 1</h3>
            </div>
            <input type="text" id="p1_name" placeholder="Full Name">
            <div class="input-row">
                <input type="number" id="p1_age" placeholder="Age">
                <select id="p1_gender">
                    <option value="" disabled selected>Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="input-row">
                <select id="p1_idType">
                    <option value="Aadhar Card">Aadhar Card</option>
                    <option value="Passport">Passport</option>
                </select>
                <input type="text" id="p1_idNumber" placeholder="ID Number">
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <h3>Pilgrim 2 (Optional)</h3>
            </div>
            <input type="text" id="p2_name" placeholder="Full Name">
            <div class="input-row">
                <input type="number" id="p2_age" placeholder="Age">
                <select id="p2_gender">
                    <option value="" disabled selected>Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="input-row">
                <select id="p2_idType">
                    <option value="Aadhar Card">Aadhaar Card</option>
                    <option value="Passport">Passport</option>
                </select>
                <input type="text" id="p2_idNumber" placeholder="ID Number">
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button id="saveBtn" class="btn btn-save" title="Save Data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span>Save</span>
        </button>
        <button id="clearBtn" class="btn btn-clear" title="Clear Data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            <span>Clear</span>
        </button>
        <button id="fillBtn" class="btn btn-fill" title="Fill Form">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span>Auto Fill</span>
        </button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
